{% extends 'base.html' %}

{% block content %}
<style>
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    main {
        flex-grow: 1;
        display: flex;
        align-items: center;
    }
</style>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h1 class="fw-bold text-primary mb-2" style="font-size: 5rem; opacity: 0.2;">404</h1>
            <h2 class="fw-bold fs-3 mb-3">Page Not Found</h2>
            <p class="text-secondary mb-4" style="font-size: 1rem;">
                Oops! The page you're looking for doesn't exist or has been moved.
            </p>
            <a href="{% url 'index' %}" class="btn btn-primary fw-bold px-4 py-2"
               style="border-radius: 8px; font-size: 0.9rem;">
                <i class="bi bi-house-door me-1"></i> Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
